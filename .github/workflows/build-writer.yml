name: 打包简记 APK

on:
  push:
    branches: [main]
    paths:
      - 'writer/**'
      - '.github/workflows/build-writer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: writer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 版本号与固定签名
        run: |
          N=${{ github.run_number }}
          sed -i "s/versionCode 1$/versionCode $N/; s/versionName \"1.0\"/versionName \"1.0.$N\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          android.signingConfigs.debug.storeFile = rootProject.file('../debug.keystore')
          android.signingConfigs.debug.storePassword = 'android'
          android.signingConfigs.debug.keyAlias = 'androiddebugkey'
          android.signingConfigs.debug.keyPassword = 'android'
          EOF
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: 同步网页与插件
        run: npx cap sync android

      - name: 编译 APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 整理文件
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jianji-v${{ github.run_number }}.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: jianji-v${{ github.run_number }}
          path: writer/jianji-v${{ github.run_number }}.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jianji-v${{ github.run_number }}
          name: 简记 v1.0.${{ github.run_number }}
          body: 手机下载下面的 jianji-v${{ github.run_number }}.apk 安装即可。更新时直接覆盖安装，数据会保留。
          files: writer/jianji-v${{ github.run_number }}.apk
          make_latest: true
